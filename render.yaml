services:
  - type: web
    name: resumeforger
    env: docker
    plan: free
    dockerfilePath: ./DockerFile
    autoDeploy: true

    envVars:
      - key: SECRET_KEY
        sync: false

      - key: FLASK_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: resumeforger_db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: resumeforger-redis
          property: connectionString

  - type: redis
    name: resumeforger-redis
    plan: free

databases:
  - name: resumeforger_db
    plan: free